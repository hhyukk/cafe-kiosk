# ──────────────────────────────────────────────────────────────────────────────
# CI 워크플로 — PR / push 시 백엔드 테스트 자동 실행
#
# 목적:
#   GitHub에 코드가 올라올 때마다 Backend/App 의 테스트(JUnit + Testcontainers)를
#   자동으로 돌려서, 깨진 코드가 main/develop 에 섞여 들어가는 것을 막는 안전망.
#
# 이 파일이 동작하는 조건:
#   - 워크플로 정의 파일은 반드시 레포 "루트"의 .github/workflows/ 아래에 있어야 한다.
#     (Backend/App/.github/... 에 두면 GitHub Actions 가 인식하지 못함)
#   - 트리거 브랜치(main/develop)가 실제로 원격에 존재해야 해당 이벤트가 발생한다.
#
# CD(배포)는 이 워크플로 범위 밖이다. AWS/EC2/S3 인프라가 준비되는 Week 4 에 별도 구성.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

# ──────────────────────────────────────────────────────────────────────────────
# on: 이 워크플로를 언제 실행할지 정의하는 트리거.
#
# pull_request:
#   아래 branches 로 "들어오는(향하는) 대상" PR 에서 실행된다.
#   즉 PR 의 base 가 main 또는 develop 일 때 동작. (PR 의 출발 브랜치는 무엇이든 상관없음)
#   PR 을 검증하는 게 CI 의 핵심 목적이므로 가장 중요한 트리거다.
#
# push:
#   main 또는 develop 브랜치에 직접 커밋이 올라갈 때(=머지 포함) 실행된다.
#   PR 머지 직후 통합된 상태에서 한 번 더 green 을 확인하는 용도.
# ──────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # backend-test: 백엔드 테스트를 실행하는 단일 job.
  backend-test:
    # GitHub 가 제공하는 우분투 러너. Docker 가 사전 설치되어 있어
    # Testcontainers 가 별도 설정 없이 컨테이너를 띄울 수 있다. (아래 'Run tests' 참고)
    runs-on: ubuntu-latest

    # defaults.run.working-directory:
    #   이 job 의 모든 'run' 명령이 실행되는 기본 디렉토리.
    #   gradlew(래퍼 스크립트)가 레포 루트가 아니라 Backend/App 에 있으므로,
    #   매 step 마다 'cd Backend/App' 을 쓰지 않도록 여기서 한 번에 고정한다.
    #   주의: uses(액션) step 에는 적용되지 않고 run(쉘 명령) step 에만 적용된다.
    defaults:
      run:
        working-directory: Backend/App

    steps:
      # 1) 레포 코드를 러너로 가져온다. CI 의 거의 모든 워크플로 첫 단계.
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 21 설치.
      #    - distribution: temurin → Eclipse Temurin(가장 널리 쓰이는 OpenJDK 배포판)
      #    - java-version: "21" → build.gradle.kts 의 toolchain(Java 21)과 일치시킴
      #    - cache: gradle → ~/.gradle 의 의존성/래퍼를 캐싱해 다음 실행 속도를 높임
      #      (Gradle 빌드 스캔과는 무관하며, 단순 디스크 캐시다)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 3) gradlew 에 실행 권한 부여.
      #    이 레포는 Windows 에서 개발되어 gradlew 파일의 유닉스 실행 비트(+x)가
      #    git 에 기록되지 않았을 수 있다. 리눅스 러너에서 './gradlew' 를 바로 실행하면
      #    "Permission denied" 가 날 수 있어 명시적으로 권한을 준다.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4) 테스트 실행 — 이 워크플로의 본체.
      #    - 테스트는 @ActiveProfiles("test") 로 application-test.yml 만 로드하므로
      #      application-dev.yml 의 ${DB_URL} 같은 환경변수나 .env 시크릿이 필요 없다.
      #    - DB 연결은 AbstractIntegrationTest 의 @DynamicPropertySource 가
      #      Testcontainers 로 띄운 postgres:16 컨테이너 URL 을 런타임에 주입한다.
      #      → 러너에 PostgreSQL 을 따로 설치할 필요 없음.
      #    - --no-daemon: CI 는 매번 새 환경이라 Gradle 데몬을 재사용할 일이 없다.
      #      데몬을 띄우지 않아 메모리/종료 관련 잡음을 줄이는, CI 의 관용적 옵션.
      - name: Run tests
        run: ./gradlew test --no-daemon

      # 5) 테스트가 실패했을 때만(if: failure()) HTML 테스트 리포트를 아티팩트로 올린다.
      #    PR 화면 → Actions 실행 결과에서 다운로드해 어떤 테스트가 왜 깨졌는지 확인 가능.
      #    성공 시에는 업로드하지 않아 저장공간/시간을 아낀다.
      #    참고: upload-artifact 의 path 는 working-directory 의 영향을 받지 않으므로
      #         레포 루트 기준 전체 경로(Backend/App/...)를 적는다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: Backend/App/build/reports/tests/test
