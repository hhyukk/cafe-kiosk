spring:
  application:
    name: App
  profiles:
    active: dev

  config:
    import:
#      # bootRun 또는 Backend/App/ 기준으로 실행할 때
      - optional:file:.env[.properties]
#      # IntelliJ Gradle 태스크처럼 프로젝트 루트 기준으로 실행할 때
#      # (워킹 디렉토리가 cafe-kiosk/ 로 잡히는 경우)
      - optional:file:Backend/App/.env[.properties]
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

file:
  upload-dir: ./uploads

cafekiosk:
  stock:
    # 재고 차감과 복구가 어느 락으로 도는지 고른다. 값을 지우면 pessimistic 이다.
    # 세 전략을 같은 동시성 테스트에 걸어 성공 건수와 재시도 횟수로 비교하려고 둔 스위치다.
    # 지금 있는 값은 pessimistic 하나뿐이고 optimistic 과 distributed 는 뒤에 붙는다.
    # 없는 값을 적으면 StockLockStrategy 빈이 안 떠서 컨텍스트가 시작하지 못한다.
    lock-strategy: pessimistic

# server.base-url 은 제거했다 (FR-FILE-07).
# 업로드 응답에 호스트를 붙이는 용도로만 쓰였는데, 그 값이 Menu.imgUrl 로 DB 에 저장돼
# 배포 환경 주소가 데이터에 박히는 원인이었다. 이제 상대경로를 내려주므로 필요 없다.

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE