spring:
  application:
    name: App
  profiles:
    active: dev

  config:
    import:
#      # bootRun 또는 Backend/App/ 기준으로 실행할 때
      - optional:file:.env[.properties]
#      # IntelliJ Gradle 태스크처럼 프로젝트 루트 기준으로 실행할 때
#      # (워킹 디렉토리가 cafe-kiosk/ 로 잡히는 경우)
      - optional:file:Backend/App/.env[.properties]
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

file:
  upload-dir: ./uploads

server:
  base-url: http://localhost:8080

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE