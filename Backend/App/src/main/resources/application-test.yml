spring:
  datasource:
    hikari:
      # 동시성 테스트가 스레드 10 개를 띄우는데 Hikari 기본 최대 풀도 정확히 10 이다.
      # 테스트 스레드의 검증 조회 하나만 끼어들어도 풀이 고갈되고, 그때 나는 타임아웃은
      # 락 경합과 생김새가 같다. 이 줄이 없으면 Phase 2 내내 원인을 락에서 찾게 된다.
      # 20 으로 잡은 것은 스레드 10 에 검증 조회와 Tomcat 요청이 얹힐 자리를 둔 것이다.
      #
      # 손님 행이 주문과 다른 트랜잭션에서 커밋되면서 그 여유가 경쟁 구간에서는 사라졌다.
      # 첫 주문 스레드 하나가 바깥 주문 트랜잭션의 커넥션을 쥔 채 손님 행용으로 하나를 더 빌린다.
      # 동시성 테스트의 열 스레드는 전부 첫 주문이라 출발 직후 20 을 다 쓴다. 검증 조회는
      # 결승선 뒤에 돌므로 겹치지 않는다. 스레드 수 이하로 내리면 열 스레드가 하나씩 쥔 채
      # 두 번째를 기다리며 서로를 막는다. 올리지도 않는다. 컨텍스트마다 풀이 따로 열리므로
      # 컨텍스트 수만큼 곱해져 PostgreSQL 연결 한도에 다가간다.
      maximum-pool-size: 20

      # 기본 30 초를 기다리면 풀 고갈이 그냥 느린 락처럼 보인다.
      # 5 초면 빨리 터지고 스택에 풀 이름이 찍혀 커넥션 문제라는 것이 바로 드러난다.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
