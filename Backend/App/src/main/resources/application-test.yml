spring:
  datasource:
    hikari:
      # 동시성 테스트가 스레드 10 개를 띄우는데 Hikari 기본 최대 풀도 정확히 10 이다.
      # 테스트 스레드의 검증 조회 하나만 끼어들어도 풀이 고갈되고, 그때 나는 타임아웃은
      # 락 경합과 생김새가 같다. 이 줄이 없으면 Phase 2 내내 원인을 락에서 찾게 된다.
      # 20 으로 잡은 것은 스레드 10 에 검증 조회와 Tomcat 요청이 얹힐 자리를 둔 것이다.
      maximum-pool-size: 20

      # 기본 30 초를 기다리면 풀 고갈이 그냥 느린 락처럼 보인다.
      # 5 초면 빨리 터지고 스택에 풀 이름이 찍혀 커넥션 문제라는 것이 바로 드러난다.
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
